name: Daily ICS Sync

on:
  # Startet jeden Tag um 01:00 UTC (entspricht 03:00 Uhr CEST in Österreich)
  schedule:
    - cron: '0 1 * * *'
  
  # Erlaubt dir, das Skript jederzeit per Knopfdruck manuell zu starten
  workflow_dispatch:

jobs:
  sync-calendar:
    runs-on: ubuntu-latest
    
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Nutzt eine aktuelle, stabile Python-Version
          
      - name: Bibliotheken installieren
        run: |
          python -m pip install --upgrade pip
          pip install supabase icalendar requests
          
      - name: ICS Importer Skript ausführen
        env:
          # Hier holt sich der Server sicher deine Secrets
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python ics_importer.py
